  Ls.sort((a,b)=>val(b)-val(a)).forEach(e=>{});
  const bySrc={},byTgt={}; L.forEach(e=>{(bySrc[e.s]=bySrc[e.s]||[]).push(e);(byTgt[e.t]=byTgt[e.t]||[]).push(e)});
  for(const k in bySrc) bySrc[k].sort((a,b)=>order(tIn).indexOf(a.t)-order(tIn).indexOf(b.t));
  for(const k in byTgt) byTgt[k].sort((a,b)=>order(sOut).indexOf(a.s)-order(sOut).indexOf(b.s));
  const y0s={},y0t={};
  for(const k in bySrc){let y=LS[k].y;bySrc[k].forEach(e=>{y0s[e.s+"|"+e.t]=y;y+=val(e)*LS[k].sc})}
  for(const k in byTgt){let y=RT[k].y;byTgt[k].forEach(e=>{y0t[e.s+"|"+e.t]=y;y+=val(e)*RT[k].sc})}
  const paths=L.map((e,i)=>{const k=e.s+"|"+e.t,ys=y0s[k],yt=y0t[k],hs=val(e)*LS[e.s].sc,ht=val(e)*RT[e.t].sc;
    const x1=lx+colW,x2=rx,cx=(x1+x2)/2; const on=isSelEdge(e);
    return `<path class="fl" data-e="${D.edges.indexOf(e)}" d="M${x1},${ys} C${cx},${ys} ${cx},${yt} ${x2},${yt} L${x2},${yt+ht} C${cx},${yt+ht} ${cx},${ys+hs} ${x1},${ys+hs} Z" fill="${trCol(e)}" fill-opacity="${on?0.55:0.08}"><title>${N[e.s].name} → ${N[e.t].name} ${CH()?fmt(e.v20,1)+"兆→"+fmt(e.v22,1)+"兆円":fmt(e.v,1)+"兆円"}</title></path>`}).join("");
  const nodesSvg=(M,x,right)=>Object.keys(M).map(id=>{const m=M[id],n=N[id];const dim=!isNear(id);
    return `<g class="fl" data-n="${id}" opacity="${dim?0.3:1}"><rect x="${x}" y="${m.y}" width="${colW}" height="${Math.max(m.h,2)}" rx="2" fill="${GC[n.grp]}"/><text x="${right?x+colW+6:x-6}" y="${m.y+Math.max(m.h,2)/2+4}" text-anchor="${right?"start":"end"}">${m.h>=11?n.name:""}</text><title>${n.name}</title></g>`}).join("");
  svg.innerHTML=`<text x="${lx}" y="${top-14}" text-anchor="end" style="font-weight:600">売る側</text><text x="${rx+colW}" y="${top-14}" style="font-weight:600">買う側</text><text x="${W/2}" y="${top-14}" text-anchor="middle" style="fill:var(--muted)">帯の太さ=取引額(${CH()?"2022年":"2020年"})</text>`+paths+nodesSvg(LS,lx,false)+nodesSvg(RT,rx,true);
}
$("flow").addEventListener("click",ev=>{const t=ev.target.closest("[data-e],[data-n]"); if(!t){select(null);return}
  if(t.dataset.e!=null) select({type:"e",e:D.edges[+t.dataset.e]}); else select({type:"n",id:t.dataset.n}); });
function spark(n){
  const v=n.real, w=170,h=46, mx=Math.max(...v), mn=Math.min(...v), pad=6;
  const yy=x=>h-pad-(x-mn)/((mx-mn)||1)*(h-2*pad), xx=i=>10+i*(w-20)/2;
  const idx=v.map(x=>x/v[0]*100); const c=n.cagr>=2?css("--up"):n.cagr<=-2?css("--down"):css("--flat");
  return `<svg width="${w}" height="${h+14}" viewBox="0 0 ${w} ${h+14}" role="img" aria-label="実質生産額の推移">
  <polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((x,i)=>xx(i)+","+yy(x)).join(" ")}"/>
  ${v.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(x)}" r="3" fill="${c}"/><text x="${xx(i)}" y="${h+11}" text-anchor="middle">${[2011,2015,2020][i]}</text>`).join("")}
  <text x="${w-2}" y="10" text-anchor="end">2011=100 → ${fmt(idx[2],0)}</text></svg>`;
}
function bar(g){const c=Math.max(-6,Math.min(6,g||0));const left=c>=0?50:50+c/6*50,wd=Math.abs(c)/6*50;
  return `<span class="bar"><i style="left:${left}%;width:${wd}%;background:${g>=2?css("--up"):g<=-2?css("--down"):css("--flat")}"></i></span>`}
function renderOverview(){
  const L=listEdges(); const hubs=L.slice(0,20).reduce((m,e)=>(m[e.s]=(m[e.s]||0)+1,m),{});
  const hub=Object.entries(hubs).sort((a,b)=>b[1]-a[1])[0];
  let ins="";
  if(CH()){
    const top=D.edges.filter(e=>e.v20!=null&&e.v22!=null).sort((a,b)=>(b.v22-b.v20)-(a.v22-a.v20)).slice(0,3);
    ins=`<div class="story">2020→2022年に最も増えた取引は、${top.map(e=>`<a href="#" data-e="${D.edges.indexOf(e)}" style="color:var(--accent)">${N[e.s].name}→${N[e.t].name}</a>(${fmt(e.v20,1)}→${fmt(e.v22,1)}兆円)`).join("、")}。エネルギーの値上がりが目立ちます。</div>
    <div class="story">2022年の名目は2020年比で+15.5%、価格の影響を除いた実質では+8.0%です。値上がりが大きかったのは石油・石炭製品、鉱業、電気・ガスなどです。<small>2021・2022年は経産省の延長表(推計)。2023年以降、生成AIの実用化などは含みません。</small></div>`;
  } else {
    const big=D.nodes.filter(n=>n.out>=15).sort((a,b)=>b.cagr-a.cagr);
    ins=`<div class="story">上位20本の取引のうち<b>${hub[1]}本</b>が「${N[hub[0]].name}」から出ています。人材・リース・警備・広告などの『外注の受け皿』が経済の中心にいます。</div>
    <div class="story">生産額15兆円以上の部門で、2011→2020年の実質成長が大きいのは:${big.slice(0,4).map(n=>`<a href="#" data-n="${n.id}" style="color:var(--accent)">${n.name}(${sgn(n.cagr)}%)</a>`).join("、")}。</div>`;
  }
  $("panel").innerHTML=`<h2>全体の見方</h2>
  <p class="note">円(部門)や線・帯(取引)をクリックすると詳細に入れます。上の切替で、3D/フロー図、2020年/2020→2022の変化を見られます。</p>
  <h3>目立つ点</h3>${ins}
  <h3>部門一覧(クリックで詳細)</h3>
  ${D.nodes.slice().sort((a,b)=>nOut(b)-nOut(a)).map(n=>`<div class="row" data-n="${n.id}"><i style="width:9px;height:9px;border-radius:50%;background:${GC[n.grp]};flex:none"></i><span class="nm">${n.name}</span><span class="num">${fmt(nOut(n),0)}兆</span>${CH()?bar(n.rg!=null?n.rg/2:0):bar(n.cagr)}<span class="num" style="width:44px;text-align:right">${CH()?(n.rg!=null?sgn(n.rg)+"%":"–"):sgn(n.cagr)+"%"}</span></div>`).join("")}
  <p class="note" style="margin-top:12px">出典: 令和2年産業連関表、平成23-27-令和2年接続産業連関表(総務省ほか)、延長産業連関表(経産省)。${CH()?"棒と数字は2020→2022年の数量(実質)の増減。":"棒と数字は2011→2020年の実質・年率。"}2020年はコロナ禍の年です。仮説は筆者の推測で、検証前のものです。</p>`;
}
function edgeRow(e){ const v=val(e); return `<div class="row" data-e="${D.edges.indexOf(e)}"><span class="nm">${N[e.s].name} → ${N[e.t].name}${(CH()?e.st22:e.story)?`<span class="tag">${CH()?e.c22:e.conf}</span>`:""}</span><span class="num">${v!=null?fmt(v,1)+"兆":"–"}</span>${CH()?"":bar(e.g)}</div>`}
function renderNode(id){
  const n=N[id];
  const E_=listEdges();
  const out=E_.filter(e=>e.s===id).slice(0,6), inn=E_.filter(e=>e.t===id).slice(0,6);
  const bs=n.subs.filter(s=>s.b);
  const chg=n.rg!=null?`<h3>2020→2022年の変化(延長表)</h3><div class="kv"><div><b>${fmt(n.o20x,0)}→${fmt(n.o22,0)}兆</b><span>生産額(名目)</span></div><div><b>${sgn(n.rg)}%</b><span>数量(実質)</span></div><div><b>${sgn(n.pc)}%</b><span>価格</span></div></div>`:`<div class="note">この部門は延長表に対応する部門がなく、2022年の数値はありません。</div>`;
  $("panel").innerHTML=`<span class="back" data-back>← 全体に戻る</span>
  <h2><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${GC[n.grp]};margin-right:6px"></i>${n.name}</h2>
  <div class="note">${D.groups[n.grp]}</div>
  <div class="kv"><div><b>${fmt(n.out,0)}兆円</b><span>生産額(2020)</span></div><div><b>${sgn(n.cagr)}%</b><span>実質増減/年(2011→20)</span></div><div><b>${fmt(n.va,0)}%</b><span>付加価値率</span></div>
  <div><b>${fmt(n.exp,0)}%</b><span>輸出向け</span></div><div><b>${fmt(n.cons,0)}%</b><span>家計消費向け</span></div><div><b>${fmt(n.imp,0)}%</b><span>輸入依存度</span></div></div>
  ${spark(n)}<div class="note">2011〜15年 ${sgn(n.c1)}%/年、2015〜20年 ${sgn(n.c2)}%/年(実質)</div>
  ${chg}
  ${bs.length?`<div class="story">この部門にはブルーオーシャン候補が含まれます:${bs.map(s=>`${s.n}<span class="tag B1">${s.b} ${D.bn[s.b]}</span>`).join("、")}<small>見えにくさと成長などで点数化した仮説。競争の少なさは直接測れていません。</small></div>`:""}
  <h3>中身(108部門・2020年の生産額と実質増減)</h3>
  ${n.subs.map(s=>`<div class="row" style="cursor:default"><span class="nm" title="${s.n}">${s.n}${s.b?`<span class="tag B1">${s.b}</span>`:""}</span><span class="num">${fmt(s.o,1)}兆</span>${bar(s.g)}<span class="num" style="width:44px;text-align:right">${sgn(s.g)}%</span></div>`).join("")}
  <h3>主な売り先(この部門が売る)</h3>${out.map(edgeRow).join("")||'<div class="note">表示範囲外</div>'}
  <h3>主な仕入れ先(この部門が買う)</h3>${inn.map(edgeRow).join("")||'<div class="note">表示範囲外</div>'}`;
}
function renderEdge(e){
  const a=N[e.s],b=N[e.t];
  const b20=e.v!=null?`<h3>2020年(基本表)</h3><div class="kv"><div><b>${fmt(e.v,1)}兆円</b><span>取引額</span></div><div><b>${fmt(e.sh,1)}%</b><span>買い手の費用に占める割合</span></div><div><b>${sgn(e.g)}%</b><span>実質増減/年(2011→20)</span></div></div><div><b>目的:</b> ${e.p||"–"}</div>
  ${e.story?`<div class="story">${e.story}<small>確からしさ ${e.conf}(A=数字から確かめやすい / B=もっともらしいが未検証 / C=弱い推測)${e.ver?"<br>確かめ方: "+e.ver:""}</small></div>`:'<div class="note">この取引には、まだ個別の仮説を付けていません。</div>'}${e.cau?`<div class="note">注意: ${e.cau}</div>`:""}`:"";
  const c22=e.v22!=null?`<h3>2020→2022年(延長表)</h3><div class="kv"><div><b>${fmt(e.v20,1)}→${fmt(e.v22,1)}兆</b><span>取引額(名目)</span></div><div><b>${fmt(e.s20,1)}→${fmt(e.s22,1)}%</b><span>買い手の費用に占める割合</span></div><div><b>${e.v20>0?sgn((e.v22/e.v20-1)*100):"–"}%</b><span>名目の増減(2年)</span></div></div>
  ${e.st22?`<div class="story">${e.st22}<small>確からしさ ${e.c22}${e.vf22?"<br>確かめ方: "+e.vf22:""}</small></div>`:'<div class="note">2022年の変化には、まだ個別の仮説を付けていません。名目の増減には値上がりを含みます。</div>'}`:"";
  $("panel").innerHTML=`<span class="back" data-back>← 全体に戻る</span>
  <h2>${a.name} → ${b.name}</h2><div class="note">モノ・サービスの向き(代金は逆向き)</div>
  ${CH()?c22+b20:b20+c22}
  <h3>両端の部門</h3>
  <div class="row" data-n="${a.id}"><i style="width:9px;height:9px;border-radius:50%;background:${GC[a.grp]}"></i><span class="nm">${a.name}</span><span class="num">${fmt(a.out,0)}兆</span></div>
  <div class="row" data-n="${b.id}"><i style="width:9px;height:9px;border-radius:50%;background:${GC[b.grp]}"></i><span class="nm">${b.name}</span><span class="num">${fmt(b.out,0)}兆</span></div>`;
}
function render(){ if(!sel) renderOverview(); else if(sel.type==="n") renderNode(sel.id); else renderEdge(sel.e); $("panel").scrollTop=0; }
$("panel").addEventListener("click",ev=>{
  const t=ev.target.closest("[data-n],[data-e],[data-back]"); if(!t) return; ev.preventDefault();
  if(t.hasAttribute("data-back")) select(null);
  else if(t.dataset.n){ const n=Graph&&Graph.graphData().nodes.find(x=>x.id===t.dataset.n); select({type:"n",id:t.dataset.n}); if(view==="3d")focusNode(n||{}) }
  else select({type:"e",e:D.edges[+t.dataset.e]});
});
function pressed(ids,on){ids.forEach(i=>$(i).setAttribute("aria-pressed",i===on))}
function setMode(m){mode=m;pressed(["m-grp","m-gro"],m==="grp"?"m-grp":"m-gro");legend();refresh()}
$("m-grp").onclick=()=>setMode("grp");$("m-gro").onclick=()=>setMode("gro");
function setView(v){view=v;pressed(["v-3d","v-fl"],v==="3d"?"v-3d":"v-fl");$("flow").hidden=v!=="fl";$("g").style.visibility=v==="3d"?"visible":"hidden";if(v==="fl")drawFlow()}
$("v-3d").onclick=()=>setView("3d");$("v-fl").onclick=()=>setView("fl");
function setPeriod(p){period=p;pressed(["p-20","p-ch"],p==="y20"?"p-20":"p-ch");legend();sel=null;reloadLinks();render()}
$("p-20").onclick=()=>setPeriod("y20");$("p-ch").onclick=()=>setPeriod("chg");
$("topn").oninput=e=>{topN=+e.target.value;$("topnv").textContent=topN;reloadLinks()};
$("b-flow").onclick=e=>{flow=!flow;e.target.setAttribute("aria-pressed",flow);refresh()};
let rot=null;
$("b-rot").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);
  if(on){rot=setInterval(()=>{if(!Graph)return;const p=Graph.cameraPosition();const a=Math.atan2(p.x,p.z)+0.006,r=Math.hypot(p.x,p.z);Graph.cameraPosition({x:r*Math.sin(a),y:p.y,z:r*Math.cos(a)})},30)}else clearInterval(rot)};
$("b-reset").onclick=()=>{select(null);if(Graph)Graph.cameraPosition({x:0,y:0,z:345},{x:0,y:0,z:0},800)};
legend(); render(); initGraph();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(Graph){Graph.backgroundColor(css("--graph"));refresh()}});
</script>
<footer style="font:12px system-ui;padding:10px 12px;opacity:.7">出典：総務省ほか「産業連関表」、経産省「延長産業連関表」（e-Stat）を筆者が加工。ストーリーは筆者の仮説であり、政府が作成したものではありません。</footer></body></html>
