<style>
  #xp {
    --font-ui: "Noto Sans JP", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, monospace;
    --sh: clamp(440px, calc(100vh - 300px), 720px);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.6;
    color: var(--fg);
  }
  #xp h1 {
    margin: 0;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  #xp .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0 0;
    max-width: 62em;
  }
  #xp .tb {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  #xp .f {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  #xp .lbl {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.2;
  }
  #xp .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  #xp .seg button {
    border: 0;
    border-radius: 0;
    padding: 5px 12px;
    min-height: 32px;
    background: var(--chip);
  }
  #xp .seg button + button {
    border-left: 1px solid var(--line);
  }
  #xp button,
  #xp select {
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #xp button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accentfg);
    border-color: var(--accent);
  }
  #xp button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  #xp button:focus-visible,
  #xp select:focus-visible,
  #xp input:focus-visible,
  #xp summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #xp select {
    min-height: 32px;
    max-width: 100%;
    width: 15em;
  }
  #xp .opt {
    margin-left: auto;
  }
  #xp .opt > summary {
    list-style: none;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 10px;
    min-height: 32px;
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--chip);
  }
  #xp .opt > summary::-webkit-details-marker {
    display: none;
  }
  #xp .opt[open] > summary {
    border-color: var(--accent);
  }
  #xp .optbox {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 20;
    width: min(340px, 100%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  #xp .optbox label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  #xp .optbox input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
  }
  #xp .optbox .num {
    font-family: var(--font-num);
    min-width: 2.2em;
    text-align: right;
  }
  #xp .hint {
    margin: 8px 2px 0;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 1.6em;
  }
  #xp .hint b {
    color: var(--fg);
  }
  #xp .sw {
    display: inline-block;
    width: 16px;
    height: 4px;
    border-radius: 2px;
    margin: 0 4px 2px 6px;
    vertical-align: middle;
  }
  #xp .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: 14px;
    align-items: start;
    margin-top: 8px;
  }
  @media (max-width: 1023px) {
    #xp .wrap {
      grid-template-columns: minmax(0, 1fr);
    }
    #xp {
      --sh: clamp(420px, 62vh, 560px);
    }
  }
  #xp .stage {
    position: relative;
    background: var(--graph);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: var(--sh);
    overflow: hidden;
  }
  #xp #g {
    position: absolute;
    inset: 0;
  }
  #xp #flow[hidden] {
    display: none;
  }
  #xp #flow {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #xp #flow text {
    fill: var(--label);
    font-size: 11.5px;
    font-family: var(--font-ui);
  }
  #xp #flow .fl {
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #xp #labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #xp .lb {
    position: absolute;
    transform: translate(-50%, 0);
    font-size: 11.5px;
    color: var(--label);
    white-space: nowrap;
    text-shadow:
      0 0 3px var(--graph),
      0 0 3px var(--graph),
      0 0 6px var(--graph);
    transition: opacity 0.15s;
  }
  #xp .lb.dim {
    opacity: 0.3;
  }
  #xp .lb.sel {
    font-weight: 700;
    font-size: 12.5px;
    color: var(--fg);
    background: var(--graph);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 0 8px;
    text-shadow: none;
  }
  #xp #fallback {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10px;
    display: none;
    justify-content: center;
    text-align: center;
    padding: 6px 20px;
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
    z-index: 1;
  }
  #xp .lgd {
    margin-top: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
  }
  #xp .lgd > summary {
    cursor: pointer;
    padding: 6px 12px;
    color: var(--muted);
    list-style: none;
  }
  #xp .lgd > summary::-webkit-details-marker {
    display: none;
  }
  #xp .lgd > summary:before {
    content: "▸ ";
  }
  #xp .lgd[open] > summary:before {
    content: "▾ ";
  }
  #xp .lgd .lgb {
    padding: 2px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #xp .lgd .r {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 14px;
    align-items: center;
  }
  #xp .lgd .r > em {
    font-style: normal;
    color: var(--muted);
    min-width: 5.5em;
  }
  #xp .lgd i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: -1px;
  }
  #xp .lgd .ln {
    display: inline-block;
    width: 20px;
    height: 4px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: 2px;
  }
  #xp .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    max-height: var(--sh);
    min-height: 320px;
    overflow: auto;
  }
  @media (max-width: 1023px) {
    #xp .panel {
      max-height: none;
    }
  }
  #xp .panel h2 {
    font-size: 16px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  #xp .panel h3 {
    font-size: 12px;
    margin: 16px 0 6px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  #xp .kv {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 10px 0;
  }
  #xp .kv div {
    background: var(--panel2);
    border-radius: 4px;
    padding: 6px 8px;
  }
  #xp .kv b {
    display: block;
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #xp .kv span {
    font-size: 11px;
    color: var(--muted);
  }
  #xp .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 4px;
    cursor: pointer;
    min-width: 0;
  }
  #xp .row:hover {
    background: var(--panel2);
  }
  /* 名前が長いときは名前だけを省略し、仮説の印(A/B/C)は常に見せる */
  #xp .row .nm {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  #xp .row .nm .tx {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #xp .row .nm .tag {
    flex: none;
  }
  #xp .row .num {
    font-family: var(--font-num);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  #xp .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--panel2);
    position: relative;
    width: 90px;
    flex: none;
  }
  #xp .bar > i {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 3px;
  }
  #xp .bar:before {
    content: "";
    position: absolute;
    left: 50%;
    top: -2px;
    bottom: -2px;
    width: 1px;
    background: var(--line);
  }
  @media (max-width: 480px) {
    #xp .bar {
      width: 48px;
    }
  }
  #xp .tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 0 6px;
    border-radius: 9px;
    background: var(--chip);
    color: var(--fg);
    margin-left: 4px;
    white-space: nowrap;
  }
  #xp .tag.B1 {
    background: #1f6fd822;
    color: var(--up);
  }
  #xp .story {
    background: var(--panel2);
    border-radius: 5px;
    padding: 9px 11px;
    margin: 8px 0;
    font-size: 13px;
  }
  #xp .story small {
    color: var(--muted);
    display: block;
    margin-top: 4px;
    font-size: 11.5px;
  }
  #xp .back {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    margin-bottom: 6px;
    display: inline-block;
  }
  #xp .note {
    font-size: 11.5px;
    color: var(--muted);
  }
  #xp .panel a[data-n],
  #xp .panel a[data-e] {
    color: var(--accent);
  }
  #xp .panel svg text {
    fill: var(--muted);
    font-size: 10px;
    font-family: var(--font-num);
  }
  #xp .m-only {
    display: none;
  }
  @media (max-width: 1023px) {
    #xp .m-only {
      display: inline;
    }
  }
  @media (max-width: 640px) {
    #xp .sub {
      display: none;
    }
    #xp .tb {
      gap: 6px 10px;
      padding: 8px 10px;
    }
    #xp .seg button {
      padding: 5px 9px;
      font-size: 12.5px;
    }
    #xp .f.sel-f {
      flex: 1 1 100%;
    }
    #xp select {
      width: 100%;
    }
    #xp .opt {
      margin-left: 0;
      flex: 1;
    }
    #xp .opt > summary {
      justify-content: center;
    }
    #xp #b-clear {
      flex: 1;
    }
    #xp .optbox {
      width: 100%;
      right: auto;
      left: 0;
    }
    #xp .hint {
      font-size: 12px;
    }
  }
</style>
<main id="xp" class="flex-1 w-full max-w-7xl mx-auto px-4 py-4">
  <header>
    <h1 class="text-2xl font-bold">産業マップ</h1>
    <p class="sub">
      日本の37産業の取引を一枚の地図にしました。<b>産業をクリック(または「産業を選ぶ」)</b>すると、仕入れ先と販売先が浮かび上がり、中身と筆者の仮説を読めます。
    </p>
  </header>
  <div class="tb mt-3" role="toolbar" aria-label="表示の切り替え">
    <div class="f">
      <span class="lbl">表示</span
      ><span class="seg"
        ><button id="v-3d" aria-pressed="true">3D</button
        ><button id="v-fl" aria-pressed="false">フロー</button></span
      >
    </div>
    <div class="f">
      <span class="lbl">年</span
      ><span class="seg"
        ><button id="p-20" aria-pressed="true">2020年</button
        ><button id="p-ch" aria-pressed="false">2020→2022の変化</button></span
      >
    </div>
    <div class="f sel-f">
      <label class="lbl" for="pick">産業を選ぶ</label
      ><select id="pick"></select>
    </div>
    <button id="b-clear" disabled>選択を解除</button>
    <details class="opt" id="opt">
      <summary>表示設定</summary>
      <div class="optbox">
        <label
          ><span>薄く表示する取引</span
          ><input id="topn" type="range" min="10" max="120" step="2" value="24" /><span id="topnv" class="num"
            >24</span
          >本</label
        >
        <label><input id="b-flow" type="checkbox" checked />取引の流れを動かす(粒子)</label>
        <label><input id="b-rot" type="checkbox" />3D を自動で回転する</label>
        <span id="rm-note" class="note" hidden
          >OSの「視差効果を減らす」設定に合わせて、動きは止めています。</span
        >
        <button id="b-reset">全体に戻す(選択解除・視点リセット)</button>
      </div>
    </details>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="wrap">
    <div>
      <div class="stage" id="stage">
        <div id="g"></div>
        <svg id="flow" hidden></svg>
        <div id="labels"></div>
        <div id="fallback">
          3Dを表示できなかったため、フロー図に切り替えました(WebGLまたはライブラリの読み込みに失敗)。
        </div>
      </div>
      <details class="lgd" id="lgd" open>
        <summary>凡例(色と大きさの意味)</summary>
        <div class="lgb" id="legend"></div>
      </details>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</main>
<script src="vendor/3d-force-graph.min.js"></script>
<script>
  window.XP = { gc: __GC__, data: __DATA__ };
</script>
<script src="explorer.js"></script>
