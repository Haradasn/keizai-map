<style>
#xp{--font-ui:"Noto Sans JP",system-ui,sans-serif;--font-num:"IBM Plex Mono",ui-monospace,monospace;--sh:clamp(440px,calc(100vh - 300px),720px);font-family:var(--font-ui);font-size:14px;line-height:1.6;color:var(--fg)}
#xp h1{margin:0;letter-spacing:.02em;line-height:1.3}
#xp .sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:62em}
#xp .tb{position:relative;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#xp .f{display:flex;flex-direction:column;gap:2px;min-width:0}
#xp .lbl{font-size:11px;color:var(--muted);line-height:1.2}
#xp .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#xp .seg button{border:0;border-radius:0;padding:5px 12px;min-height:32px;background:var(--chip)}
#xp .seg button+button{border-left:1px solid var(--line)}
#xp button,#xp select{font:inherit;font-size:13px;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
#xp button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#xp button:disabled{opacity:.45;cursor:default}
#xp button:focus-visible,#xp select:focus-visible,#xp input:focus-visible,#xp summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#xp select{min-height:32px;max-width:100%;width:15em}
#xp .opt{margin-left:auto}
#xp .opt>summary{list-style:none;cursor:pointer;font-size:13px;padding:4px 10px;min-height:32px;display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--chip)}
#xp .opt>summary::-webkit-details-marker{display:none}
#xp .opt[open]>summary{border-color:var(--accent)}
#xp .optbox{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(340px,100%);display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#xp .optbox label{display:flex;align-items:center;gap:8px;font-size:13px}
#xp .optbox input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#xp .optbox .num{font-family:var(--font-num);min-width:2.2em;text-align:right}
#xp .hint{margin:8px 2px 0;font-size:12.5px;color:var(--muted);min-height:1.6em}
#xp .hint b{color:var(--fg)}
#xp .sw{display:inline-block;width:16px;height:4px;border-radius:2px;margin:0 4px 2px 6px;vertical-align:middle}
#xp .wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start;margin-top:8px}
@media(max-width:1023px){#xp .wrap{grid-template-columns:minmax(0,1fr)}#xp{--sh:clamp(420px,62vh,560px)}}
#xp .stage{position:relative;background:var(--graph);border:1px solid var(--line);border-radius:8px;height:var(--sh);overflow:hidden}
#xp #g{position:absolute;inset:0}
#xp #flow[hidden]{display:none}#xp #flow{position:absolute;inset:0;width:100%;height:100%}
#xp #flow text{fill:var(--label);font-size:11.5px;font-family:var(--font-ui)}#xp #flow .fl{cursor:pointer;transition:opacity .15s}
#xp #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#xp .lb{position:absolute;transform:translate(-50%,0);font-size:11.5px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--graph),0 0 3px var(--graph),0 0 6px var(--graph);transition:opacity .15s}
#xp .lb.dim{opacity:.3}
#xp .lb.sel{font-weight:700;font-size:12.5px;color:var(--fg);background:var(--graph);border:1px solid var(--accent);border-radius:10px;padding:0 8px;text-shadow:none}
#xp #fallback{position:absolute;left:0;right:0;bottom:10px;display:none;justify-content:center;text-align:center;padding:6px 20px;color:var(--muted);font-size:12px;pointer-events:none;z-index:1}
#xp .lgd{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12px}
#xp .lgd>summary{cursor:pointer;padding:6px 12px;color:var(--muted);list-style:none}
#xp .lgd>summary::-webkit-details-marker{display:none}
#xp .lgd>summary:before{content:"▸ "}#xp .lgd[open]>summary:before{content:"▾ "}
#xp .lgd .lgb{padding:2px 12px 10px;display:flex;flex-direction:column;gap:6px}
#xp .lgd .r{display:flex;flex-wrap:wrap;gap:3px 14px;align-items:center}
#xp .lgd .r>em{font-style:normal;color:var(--muted);min-width:5.5em}
#xp .lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#xp .lgd .ln{display:inline-block;width:20px;height:4px;border-radius:2px;margin-right:5px;vertical-align:2px}
#xp .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:var(--sh);min-height:320px;overflow:auto}
@media(max-width:1023px){#xp .panel{max-height:none}}
#xp .panel h2{font-size:16px;margin:0 0 2px;font-weight:700}
#xp .panel h3{font-size:12px;margin:16px 0 6px;color:var(--muted);font-weight:600;letter-spacing:.06em}
#xp .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
#xp .kv div{background:var(--panel2);border-radius:4px;padding:6px 8px}
#xp .kv b{display:block;font-family:var(--font-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
#xp .kv span{font-size:11px;color:var(--muted)}
#xp .row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;min-width:0}
#xp .row:hover{background:var(--panel2)}
#xp .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#xp .row .num{font-family:var(--font-num);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#xp .bar{height:6px;border-radius:3px;background:var(--panel2);position:relative;width:90px;flex:none}
#xp .bar>i{position:absolute;top:0;bottom:0;border-radius:3px}
#xp .bar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
@media(max-width:480px){#xp .bar{width:48px}}
#xp .tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--fg);margin-left:4px;white-space:nowrap}
#xp .tag.B1{background:#1f6fd822;color:var(--up)}
#xp .story{background:var(--panel2);border-radius:5px;padding:9px 11px;margin:8px 0;font-size:13px}
#xp .story small{color:var(--muted);display:block;margin-top:4px;font-size:11.5px}
#xp .back{font-size:12px;color:var(--accent);cursor:pointer;margin-bottom:6px;display:inline-block}
#xp .note{font-size:11.5px;color:var(--muted)}
#xp .panel a[data-n],#xp .panel a[data-e]{color:var(--accent)}
#xp .panel svg text{fill:var(--muted);font-size:10px;font-family:var(--font-num)}
#xp .m-only{display:none}
@media(max-width:1023px){#xp .m-only{display:inline}}
@media(max-width:640px){#xp .sub{display:none}#xp .tb{gap:6px 10px;padding:8px 10px}#xp .seg button{padding:5px 9px;font-size:12.5px}
#xp .f.sel-f{flex:1 1 100%}#xp select{width:100%}#xp .opt{margin-left:0;flex:1}#xp .opt>summary{justify-content:center}#xp #b-clear{flex:1}#xp .optbox{width:100%;right:auto;left:0}#xp .hint{font-size:12px}}
</style>
<main id="xp" class="flex-1 w-full max-w-7xl mx-auto px-4 py-4">
<header>
<h1 class="text-2xl font-bold">産業マップ</h1>
<p class="sub">日本の37産業の取引を一枚の地図にしました。<b>産業をクリック(または「産業を選ぶ」)</b>すると、仕入れ先と販売先が浮かび上がり、中身と筆者の仮説を読めます。</p>
</header>
<div class="tb mt-3" role="toolbar" aria-label="表示の切り替え">
  <div class="f"><span class="lbl">表示</span><span class="seg"><button id="v-3d" aria-pressed="true">3D</button><button id="v-fl" aria-pressed="false">フロー</button></span></div>
  <div class="f"><span class="lbl">年</span><span class="seg"><button id="p-20" aria-pressed="true">2020年</button><button id="p-ch" aria-pressed="false">2020→2022の変化</button></span></div>
  <div class="f sel-f"><label class="lbl" for="pick">産業を選ぶ</label><select id="pick"></select></div>
  <button id="b-clear" disabled>選択を解除</button>
  <details class="opt" id="opt"><summary>表示設定</summary>
    <div class="optbox">
      <label><span>薄く表示する取引</span><input id="topn" type="range" min="10" max="120" step="2" value="24"><span id="topnv" class="num">24</span>本</label>
      <label><input id="b-flow" type="checkbox" checked>取引の流れを動かす(粒子)</label>
      <label><input id="b-rot" type="checkbox">3D を自動で回転する</label>
      <span id="rm-note" class="note" hidden>OSの「視差効果を減らす」設定に合わせて、動きは止めています。</span>
      <button id="b-reset">全体に戻す(選択解除・視点リセット)</button>
    </div>
  </details>
</div>
<p class="hint" id="hint" aria-live="polite"></p>
<div class="wrap">
  <div>
    <div class="stage" id="stage">
      <div id="g"></div><svg id="flow" hidden></svg><div id="labels"></div>
      <div id="fallback">3Dを表示できなかったため、フロー図に切り替えました(WebGLまたはライブラリの読み込みに失敗)。</div>
    </div>
    <details class="lgd" id="lgd" open><summary>凡例(色と大きさの意味)</summary><div class="lgb" id="legend"></div></details>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
</main>
<script src="vendor/3d-force-graph.min.js"></script>
<script>
const D=__DATA__;
const GC=__GC__;
const N=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id);
const fmt=(x,d=1)=>x==null?"–":Number(x).toLocaleString("ja-JP",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=x=>x==null?"–":(x>0?"+":"")+fmt(x,1);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile=()=>innerWidth<640;
const FK=6;             // 選択時に強調する仕入れ先・販売先の数
const FOVY=22, ZK=0.6, REL=3;  // 3Dの視野角(小さいほど遠近が弱い)と奥行きの圧縮
/* ---- 配色トークン(テーマ切替で再取得) ---- */
let T={};
function readTokens(){const s=getComputedStyle($("xp"));const g=n=>s.getPropertyValue(n).trim();
  T={up:g("--up"),flat:g("--flat"),down:g("--down"),link:g("--link"),lin:g("--lin"),lout:g("--lout"),accent:g("--accent"),graph:g("--graph")}}
const al=(hex,a)=>hex+Math.round(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,"0");

let topN=24, sel=null, flowOn=!REDUCED, Graph=null, period="y20", view="3d";   // スマホでも最初は3D(見た目のインパクトを優先。フローへは上で切り替え)
const CH=()=>period==="chg";
const val=e=>CH()?e.v22:e.v;
const tr=e=>{ if(CH()){const d=(e.s22!=null&&e.s20!=null)?e.s22-e.s20:0; return d>=0.8?1:d<=-0.8?-1:0} const g=e.g||0; return g>=2?1:g<=-2?-1:0 };
const trCol=e=>({1:T.up,0:T.flat,"-1":T.down})[tr(e)];
const nOut=n=>CH()&&n.o22!=null?n.o22:n.out;
const nodeBase=n=>CH()?T.flat:GC[n.grp];     // 円の色: 2020年=部門グループ / 変化=灰色(増減色と混ぜない)

/* ---- 取引(エッジ)の集合 ---- */
let _all=null,_allP=null;
function allE(){ if(_allP!==period){_all=D.edges.filter(e=>e.s!==e.t&&val(e)!=null&&val(e)>0).sort((a,b)=>val(b)-val(a));_allP=period} return _all }
const ovSet=()=>new Set(allE().slice(0,topN));
function focusEdges(id){const A=allE();return {inn:A.filter(e=>e.t===id).slice(0,FK),out:A.filter(e=>e.s===id).slice(0,FK)}}
let OV=new Set(), NEAR=null, LP=[];
function recompute(){
  OV=ovSet(); NEAR=null;
  if(sel&&sel.type==="n"){const f=focusEdges(sel.id);NEAR=new Set([sel.id]);f.inn.concat(f.out).forEach(e=>{NEAR.add(e.s);NEAR.add(e.t)});sel.f=f}
  else if(sel){NEAR=new Set([sel.e.s,sel.e.t])}
  // ラベルを出す順(優先度): 選択 → 取引先 → 生産額の大きい12部門
  LP=[];const seen=new Set();const add=(id,c)=>{if(!seen.has(id)){seen.add(id);LP.push([id,c])}};
  if(sel&&sel.type==="n"){add(sel.id,"sel");sel.f.inn.concat(sel.f.out).sort((a,b)=>val(b)-val(a)).forEach(e=>{add(e.s,"hl");add(e.t,"hl")})}
  else if(sel){add(sel.e.s,"sel");add(sel.e.t,"sel")}
  D.nodes.slice().sort((a,b)=>nOut(b)-nOut(a)).slice(0,12).forEach(n=>add(n.id,sel?"dim":"big"));
}
const isNear=id=>!NEAR||NEAR.has(id);
function roleOf(e){
  if(!sel) return "none";
  if(sel.type==="n") return e.t===sel.id?"in":e.s===sel.id?"out":"other";
  return e===sel.e?"sel":"other";
}
/* 線の見た目: 色・不透明度・太さ(2020年=単色、変化=増減色) */
function estyle(e){
  const role=roleOf(e), inOv=OV.has(e), v=val(e);
  const base=CH()?trCol(e):T.link;
  if(!sel) return {role,col:base,a:inOv?(CH()?.6:.5):0,w:0.3+Math.sqrt(v)*0.5};
  if(role==="other") return {role,col:base,a:inOv?.08:0,w:0.2};
  const col=CH()?trCol(e):role==="in"?T.lin:role==="out"?T.lout:T.accent;
  return {role,col,a:.95,w:0.7+Math.sqrt(v)*1.1};
}
/* ---- 凡例・ヒント ---- */
function legend(){
  const nodeRow=CH()?`<div class="r"><em>円</em><span>灰色(この表示では色に意味はありません。大きさ=2022年の生産額)</span></div>`
   :`<div class="r"><em>円の色</em>${D.groups.map((g,i)=>`<span><i style="background:${GC[i]}"></i>${g}</span>`).join("")}</div><div class="r"><em>円の大きさ</em><span>2020年の生産額(大きいほど大きい)</span></div>`;
  const sw=(c,t)=>`<span><span class="ln" style="background:${c}"></span>${t}</span>`;
  const lk=CH()?`<div class="r"><em>線の色</em>${sw(T.up,"買い手の費用に占める割合が上昇(+0.8pt〜)")}${sw(T.flat,"横ばい")}${sw(T.down,"低下(−0.8pt〜)")}</div><div class="r"><em>線の太さ</em><span>2022年の取引額。向きは売り手→買い手(矢印・粒子)</span></div>`
   :`<div class="r"><em>線</em>${sw(T.link,"取引額の大きい上位"+topN+"本(薄く表示)")}${sw(T.lin,"選択した産業の仕入れ先")}${sw(T.lout,"選択した産業の販売先")}</div><div class="r"><em>線の太さ</em><span>取引額。向きは売り手→買い手(矢印・粒子)</span></div>`;
  $("legend").innerHTML=nodeRow+lk+`<div class="r"><span class="note">配置は固定で、同じ色(部門グループ)がまとまるように並べただけです。距離そのものに厳密な意味はありません。3Dは遠近を弱めてあり、円の大きさは生産額の比較に使えます。</span></div>`;
}
function syncUI(){
  $("pick").value=sel&&sel.type==="n"?sel.id:"";
  $("b-clear").disabled=!sel;
  const sw=(c)=>`<span class="sw" style="background:${c}"></span>`;
  let h;
  if(!sel) h=`<b>使い方:</b> 円(産業)をクリック、または「産業を選ぶ」で、取引先だけが浮かび上がります。(薄い線は取引額が大きい上位${topN}本)`;
  else if(sel.type==="n"){const f=sel.f;
    h=`<b>${N[sel.id].name}</b> を選択中。`+(CH()?`線の色は増減(凡例参照)。向きは売り手→買い手です。`:`${sw(T.lin)}仕入れ先(この産業が買う相手)上位${f.inn.length}${sw(T.lout)}販売先(この産業が売る相手)上位${f.out.length}`)+` 他は薄くしています。<a class="m-only" href="#panel" style="color:var(--accent)">詳細を見る ↓</a>`}
  else h=`<b>${N[sel.e.s].name} → ${N[sel.e.t].name}</b> の取引を選択中。<a class="m-only" href="#panel" style="color:var(--accent)">詳細を見る ↓</a>`;
  $("hint").innerHTML=h; legend();
}
/* ---- 3D ---- */
const bbox=(()=>{const xs=D.nodes.map(n=>n.x),ys=D.nodes.map(n=>n.y);return {cx:(Math.min(...xs)+Math.max(...xs))/2,cy:(Math.min(...ys)+Math.max(...ys))/2,w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}})();
function fit3d(ms){
  if(!Graph) return;
  const W=$("stage").clientWidth,H=$("stage").clientHeight, asp=W/Math.max(H,1);
  const padW=bbox.w+50, padH=bbox.h+50;                      // 余白つきで全体を収める
  const visH=Math.max(padH,padW/asp);
  const d=visH/(2*Math.tan(FOVY*Math.PI/360));
  Graph.cameraPosition({x:bbox.cx,y:bbox.cy,z:d},{x:bbox.cx,y:bbox.cy,z:0},ms||0);
}
function initGraph(){
  try{
    if(typeof ForceGraph3D==="undefined") throw 0;
    Graph=ForceGraph3D({controlType:"orbit"})($("g"))
      .backgroundColor(T.graph)
      .graphData({nodes:D.nodes.map(n=>({...n,fx:n.x,fy:n.y,fz:n.z*ZK})),links:allE().map(e=>({source:e.s,target:e.t,e}))})
      .nodeId("id").nodeRelSize(REL).nodeResolution(20).nodeOpacity(0.95)
      .nodeLabel(n=>`<div style="font:13px sans-serif;padding:3px 6px;background:rgba(10,12,18,.9);color:#fff;border-radius:3px">${n.name}<br>${fmt(nOut(n),0)}兆円${CH()&&n.rg!=null?` / 数量${sgn(n.rg)}%・価格${sgn(n.pc)}%`:` / 実質${sgn(n.cagr)}%/年`}</div>`)
      .linkOpacity(1).linkDirectionalArrowRelPos(1).linkDirectionalParticleWidth(2)
      .linkLabel(l=>`<div style="font:12px sans-serif;padding:3px 6px;background:rgba(10,12,18,.9);color:#fff;border-radius:3px">${N[l.e.s].name} → ${N[l.e.t].name}<br>${CH()?`${fmt(l.e.v20,1)}兆 → ${fmt(l.e.v22,1)}兆円`:`${fmt(l.e.v,1)}兆円 / 実質${sgn(l.e.g)}%/年`}</div>`)
      .onNodeClick(n=>select({type:"n",id:n.id}))
      .onLinkClick(l=>{ if(estyle(l.e).a>0) select({type:"e",e:l.e}) })
      .onBackgroundClick(()=>select(null))
      .cooldownTicks(0).showNavInfo(false)
      .width($("stage").clientWidth).height($("stage").clientHeight);
    Graph.camera().fov=FOVY; Graph.camera().updateProjectionMatrix();
    Graph.controls().autoRotateSpeed=1.1;
    applyStyle(); fit3d(0);
    new ResizeObserver(()=>{if(Graph)Graph.width($("stage").clientWidth).height($("stage").clientHeight);if(view==="fl")drawFlow()}).observe($("stage"));
    labelLoop();
  }catch(err){ $("fallback").style.display="flex"; Graph=null; setView("fl") }
}
function applyStyle(){   // 新しい関数を渡して再描画させる
  if(!Graph) return;
  Graph.nodeVal(n=>Math.max(nOut(n),2))
    .nodeColor(n=>{const c=nodeBase(n);return isNear(n.id)?c:al(c,.2)})
    .linkVisibility(l=>estyle(l.e).a>0)
    .linkWidth(l=>estyle(l.e).w)
    .linkColor(l=>{const s=estyle(l.e);return al(s.col,s.a)})
    .linkDirectionalArrowLength(l=>{const r=estyle(l.e).role;return r==="in"||r==="out"||r==="sel"?5:0})
    .linkDirectionalParticles(l=>{const r=estyle(l.e).role;return flowOn&&(r==="in"||r==="out"||r==="sel")?Math.min(4,Math.ceil(val(l.e)/2)):0})
    .linkDirectionalParticleColor(l=>estyle(l.e).col)
    .linkDirectionalParticleSpeed(l=>0.004+val(l.e)*0.0004);
}
let labelEls={};
function labelLoop(){
  const box=$("labels");
  D.nodes.forEach(n=>{const d=document.createElement("div");d.className="lb";d.textContent=n.name;d.style.display="none";box.appendChild(d);labelEls[n.id]=d});
  (function tick(){
    const on=view==="3d"&&Graph;
    if(!on){for(const id in labelEls) labelEls[id].style.display="none"}
    else{
      const SW=$("stage").clientWidth, placed=[], shown=new Set(), fs=SW<500?11:11.5, cw=fs+0.5;
      for(const [id,cls] of LP){const n=Graph.graphData().nodes.find(x=>x.id===id); if(!n||n.x==null) continue;
        const d=labelEls[id], p=Graph.graph2ScreenCoords(n.x,n.y,n.z||0), q=Graph.graph2ScreenCoords(n.x+Math.cbrt(Math.max(nOut(n),2))*REL,n.y,n.z||0);
        const r=Math.abs(q.x-p.x), w=n.name.length*cw+(cls==="sel"?18:6), h=cls==="sel"?20:16;
        const x=Math.min(Math.max(p.x,w/2+2),SW-w/2-2), y=p.y+r+2;
        const b={l:x-w/2-2,r:x+w/2+2,t:y-1,b:y+h};
        if(placed.some(o=>b.l<o.r&&b.r>o.l&&b.t<o.b&&b.b>o.t)){continue}
        placed.push(b); shown.add(id);
        d.style.display=""; d.style.left=x+"px"; d.style.top=y+"px"; d.style.fontSize=fs+"px";
        d.className="lb"+(cls==="sel"?" sel":cls==="dim"?" dim":"");
      }
      for(const id in labelEls) if(!shown.has(id)) labelEls[id].style.display="none";
    }
    requestAnimationFrame(tick);
  })();
}
function refresh(){ applyStyle(); if(view==="fl") drawFlow() }
function reloadLinks(){ if(Graph) Graph.graphData({nodes:Graph.graphData().nodes,links:allE().map(e=>({source:e.s,target:e.t,e}))}); recompute(); refresh() }
function select(s){ sel=s; recompute(); syncUI(); refresh(); render() }

function flowEdges(){ const s=new Set(OV); if(sel&&sel.type==="n"){sel.f.inn.concat(sel.f.out).forEach(e=>s.add(e))} else if(sel&&allE().includes(sel.e)) s.add(sel.e); return allE().filter(e=>s.has(e)) }
function drawFlow(){
  const svg=$("flow"), W=$("stage").clientWidth, H=$("stage").clientHeight; if(!W||!H) return;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const mob=W<560, fs=mob?10.5:11.5, colW=mob?10:14, lx=Math.min(190,W*(mob?0.31:0.26)), rx=W-lx-colW, top=34, bot=H-10;
  const maxCh=Math.max(3,Math.floor((lx-10)/fs)), cut=s=>s.length>maxCh?s.slice(0,maxCh-1)+"…":s;
  const L=flowEdges(), sOut={},tIn={}; L.forEach(e=>{sOut[e.s]=(sOut[e.s]||0)+val(e);tIn[e.t]=(tIn[e.t]||0)+val(e)});
  const order=o=>Object.keys(o).sort((a,b)=>N[a].grp-N[b].grp||o[b]-o[a]);
  const lay=o=>{const ids=order(o),tot=Object.values(o).reduce((a,b)=>a+b,0),avail=(bot-top)-ids.length*4,sc=avail/tot;let y=top;const m={};ids.forEach(id=>{m[id]={y,h:o[id]*sc,sc};y+=o[id]*sc+4});return m};
  const LS=lay(sOut), RT=lay(tIn), oS=order(sOut), oT=order(tIn);
  const bySrc={},byTgt={}; L.forEach(e=>{(bySrc[e.s]=bySrc[e.s]||[]).push(e);(byTgt[e.t]=byTgt[e.t]||[]).push(e)});
  for(const k in bySrc) bySrc[k].sort((a,b)=>oT.indexOf(a.t)-oT.indexOf(b.t));
  for(const k in byTgt) byTgt[k].sort((a,b)=>oS.indexOf(a.s)-oS.indexOf(b.s));
  const y0s={},y0t={};
  for(const k in bySrc){let y=LS[k].y;bySrc[k].forEach(e=>{y0s[e.s+"|"+e.t]=y;y+=val(e)*LS[k].sc})}
  for(const k in byTgt){let y=RT[k].y;byTgt[k].forEach(e=>{y0t[e.s+"|"+e.t]=y;y+=val(e)*RT[k].sc})}
  const focusFirst=L.slice().sort((a,b)=>(estyle(a).a>.5)-(estyle(b).a>.5));   // 強調する帯を手前に
  const paths=focusFirst.map(e=>{const k=e.s+"|"+e.t,ys=y0s[k],yt=y0t[k],hs=val(e)*LS[e.s].sc,ht=val(e)*RT[e.t].sc,st=estyle(e);
    const x1=lx+colW,x2=rx,cx=(x1+x2)/2, op=!sel?(CH()?.5:.4):st.a>.5?.75:.07;
    return `<path class="fl" data-e="${D.edges.indexOf(e)}" d="M${x1},${ys} C${cx},${ys} ${cx},${yt} ${x2},${yt} L${x2},${yt+ht} C${cx},${yt+ht} ${cx},${ys+hs} ${x1},${ys+hs} Z" fill="${st.a>.5||!sel?st.col:T.link}" fill-opacity="${op}"><title>${N[e.s].name} → ${N[e.t].name} ${CH()?fmt(e.v20,1)+"兆→"+fmt(e.v22,1)+"兆円":fmt(e.v,1)+"兆円"}</title></path>`}).join("");
  const labelSet=M=>{const c=Object.keys(M).map(id=>({id,y:M[id].y+Math.max(M[id].h,2)/2,pri:(sel&&sel.type==="n"&&sel.id===id?2e6:sel&&NEAR.has(id)?1e6:0)+M[id].h})).sort((a,b)=>b.pri-a.pri),ys=[],ok=new Set();
    for(const q of c){ if(!(q.pri>=1e6||M[q.id].h>=(mob?13:11))||ys.some(y=>Math.abs(y-q.y)<fs+3)) continue; ys.push(q.y); ok.add(q.id)} return ok};
  const nodesSvg=(M,x,right)=>{const LB=labelSet(M);return Object.keys(M).map(id=>{const m=M[id],n=N[id],near=isNear(id),h=Math.max(m.h,2),show=LB.has(id);
    return `<g class="fl" data-n="${id}" opacity="${near?1:.3}"><rect x="${x}" y="${m.y}" width="${colW}" height="${h}" rx="2" fill="${nodeBase(n)}"/><text x="${right?x+colW+6:x-6}" y="${m.y+h/2+4}" text-anchor="${right?"start":"end"}" style="font-size:${fs}px${sel&&sel.type==="n"&&sel.id===id?";font-weight:700":""}">${show?cut(n.name):""}</text><title>${n.name}</title></g>`}).join("")};
  svg.innerHTML=`<text x="${lx}" y="20" text-anchor="end" style="font-weight:600;font-size:${fs}px">売る側</text><text x="${rx+colW}" y="20" style="font-weight:600;font-size:${fs}px">買う側</text><text x="${W/2}" y="20" text-anchor="middle" style="fill:var(--muted);font-size:${fs-0.5}px">帯の太さ=取引額(${CH()?"2022年":"2020年"})</text>`+paths+nodesSvg(LS,lx,false)+nodesSvg(RT,rx,true);
}
$("flow").addEventListener("click",ev=>{const t=ev.target.closest("[data-e],[data-n]"); if(!t){select(null);return}
  if(t.dataset.e!=null) select({type:"e",e:D.edges[+t.dataset.e]}); else select({type:"n",id:t.dataset.n}); });

function spark(n){
  const v=n.real, w=170,h=46, mx=Math.max(...v), mn=Math.min(...v), pad=6;
  const yy=x=>h-pad-(x-mn)/((mx-mn)||1)*(h-2*pad), xx=i=>10+i*(w-20)/2;
  const idx=v.map(x=>x/v[0]*100); const c=n.cagr>=2?T.up:n.cagr<=-2?T.down:T.flat;
  return `<svg width="${w}" height="${h+14}" viewBox="0 0 ${w} ${h+14}" role="img" aria-label="実質生産額の推移">
  <polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((x,i)=>xx(i)+","+yy(x)).join(" ")}"/>
  ${v.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(x)}" r="3" fill="${c}"/><text x="${xx(i)}" y="${h+11}" text-anchor="middle">${[2011,2015,2020][i]}</text>`).join("")}

}
function bar(g){const c=Math.max(-6,Math.min(6,g||0));const left=c>=0?50:50+c/6*50,wd=Math.abs(c)/6*50;
