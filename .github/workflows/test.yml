name: test
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest playwright pandas pillow jinja2 && playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - name: コードの整形・静的チェック(ruff / prettier)
        run: pip install ruff && ruff format --check . && ruff check .
      - run: npm install --no-audit --no-fund
      - name: ビルド(ページ生成 → 出力HTMLの整形 → CSS)
        run: npm run build && npm run build:css && npm run format:check
      - name: コミット済みの site/ が最新のビルド結果か
        run: git diff --exit-code -- site pages/lastmod.json || { echo "::error::site/ が最新ではありません。npm run build && npm run build:css を実行してコミットしてください"; exit 1; }
      - name: pytest
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee out.txt || { grep -E "^(FAILED|E  )" out.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
