# 本番にデプロイされたあと、更新したページを IndexNow(Bing など)に知らせる。
# 初回やまとめて送りたいときは手動実行で「all」を選ぶ。
name: indexnow
on:
  push:
    branches: [main]
    paths: ["pages/lastmod.json"]
  workflow_dispatch:
    inputs:
      scope:
        description: "changed=直前の更新分 / all=全ページ"
        default: changed
        type: choice
        options: [changed, all]
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: デプロイを待つ(Cloudflare のビルドは1〜2分)
        if: github.event_name == 'push'
        run: sleep 180
      - name: キーのファイルが本番に出ているか
        run: |
          k=$(ls site | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          curl -sf "https://keizai-atlas.com/$k.txt" | grep -qx "$k" || { echo "::error::キーのファイルが本番にありません"; exit 1; }
      - name: 送信
        run: |
          python3 scripts/ops/indexnow.py ${{ inputs.scope || 'changed' }} > out.txt
          echo "::notice::$(cat out.txt)"
