name: weekly-report
# 週次レポート(アクセス解析・検索)。非公開リポジトリ keizai-atlas-reports に reports/日付.md として保存し、そちらで Issue にして通知する。
# このリポジトリは公開なので、レポートの数値はログに出さない(ファイルにだけ書く)。
on:
  schedule:
    - cron: "0 23 * * 0"   # 毎週月曜 8:00 JST
  workflow_dispatch:
    inputs:
      since:
        description: "集計の開始日(YYYY-MM-DD)。空なら直近7日"
        required: false
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install google-auth requests
      - name: キーが使えるか確認(数値は出さない)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: python3 scripts/weekly_report.py --check
      - name: レポートを作る(ファイルにだけ書く)
        env:
          REPORT_SINCE: ${{ inputs.since }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: python3 scripts/weekly_report.py > /tmp/report.md 2>/tmp/report.err || { echo "レポート作成に失敗(詳細は非表示)"; exit 1; }
      - name: 非公開リポジトリに保存
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${REPORT_TOKEN}@github.com/Haradasn/keizai-atlas-reports.git" /tmp/r
          d=$(TZ=Asia/Tokyo date +%F); f="reports/$d.md"
          if [ -e "/tmp/r/$f" ]; then f="reports/$d-$(TZ=Asia/Tokyo date +%H%M).md"; fi
          cp /tmp/report.md "/tmp/r/$f"
          # 読者の反応(D1)の全件を backup/ に上書き保存(履歴は git に残る)。中身はログに出さない
          mkdir -p /tmp/r/backup
          curl -sSf -H "Authorization: Bearer ${FEEDBACK_KEY}" -H "User-Agent: keizai-atlas-weekly-report" \
            "https://keizai-atlas.com/api/feedback/export" -o /tmp/r/backup/feedback.json \
            && git -C /tmp/r add backup/feedback.json || echo "::warning::読者の反応のバックアップに失敗"
          cd /tmp/r && git add "$f" && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "週次レポート $d" && git push -q origin HEAD:main
          echo "保存しました: $f"
