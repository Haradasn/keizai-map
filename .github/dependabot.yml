# 依存ライブラリの更新を月1回 PR にする(脆弱性の修正は随時)。
# site/vendor/ に同梱しているライブラリ(MapLibre、3d-force-graph)は手で更新するため対象外。
# tailwind / prettier の更新で出力が変わると CI の「site/ が最新か」で落ちるので、その PR はビルドし直してコミットする。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: 3d-force-graph
      # Tailwind 4 / daisyUI 5 は設定の書き方が変わるので、移行するときに手で行う
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: daisyui
        update-types: ["version-update:semver-major"]
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ["*"]
